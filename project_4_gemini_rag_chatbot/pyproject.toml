[project]
name = "gemini-rag-chatbot"
version = "0.1.0"
description = "Local RAG chatbot using ChromaDB vector store and Google Gemini API for grounded generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.8.0",
    "openai>=2.41.0",
    "pypdf>=6.13.0",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.13.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
