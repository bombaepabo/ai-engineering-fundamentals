[project]
name = "support-ticket-intelligence"
version = "0.1.0"
description = "AI-powered support ticket intelligence platform with FastAPI, scikit-learn, pgvector, and Google Gemini."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",     # file uploads in FastAPI

    # --- Config ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # --- Database ---
    "sqlalchemy>=2.0.35",
    "psycopg2-binary>=2.9.9",      # PostgreSQL driver
    "pgvector>=0.3.5",             # pgvector SQLAlchemy integration
    "alembic>=1.13.0",             # database migrations

    # --- Classical ML ---
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "joblib>=1.4.0",

    # --- LLM / Embeddings ---
    "google-genai>=1.0.0",

    # --- Utilities ---
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",               # async test client for FastAPI
    "ruff>=0.6.0",                 # linter + formatter
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]    # errors, pyflakes, imports, py-upgrade

[tool.pytest.ini_options]
testpaths = ["tests"]
